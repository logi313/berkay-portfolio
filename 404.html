<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101111">
  <meta name="robots" content="noindex">
  <title>Page not found — Berkay Alioglu</title>
  <script>
    // GitHub Pages serves this page for any missing path, so asset links are built from the site root:
    // /berkay-portfolio/ on github.io, / once the custom domain is connected.
    window.SITE_ROOT = location.pathname.startsWith('/berkay-portfolio/') || location.pathname === '/berkay-portfolio' ? '/berkay-portfolio/' : '/';
    document.write('<base href="' + window.SITE_ROOT + '">');
  </script>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:Inter;src:url('assets/inter.woff2') format('woff2');font-weight:100 900;font-display:swap}
    @font-face{font-family:'Monument Extended';src:url('assets/monument-extended-regular.woff2') format('woff2');font-weight:400;font-display:swap}
    :root{--ink:#101111;--paper:#f5f5f3;--muted:#bec0bf;--acid:#d8ff73;--line:rgba(241,241,233,.23);--gutter:clamp(22px,4.2vw,80px)}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--ink);color:var(--paper);font:400 16px/1.6 Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
    a{color:inherit;text-decoration:none}
    .art{position:fixed;inset:0;background:url('assets/showreel-poster.jpg') 50% 50%/cover no-repeat;opacity:.28;filter:grayscale(.2)}
    .shade{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 0,#101111b3 55%,#101111 100%)}
    header{position:relative;display:flex;align-items:center;justify-content:space-between;height:84px;padding:0 var(--gutter);border-bottom:1px solid var(--line)}
    .monogram{font:400 24px/1 'Monument Extended',Arial,sans-serif;letter-spacing:-.02em}
    .monogram span{color:var(--paper)}
    .role{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    main{position:relative;height:calc(100% - 84px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--gutter) 84px}
    .code{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--acid)}
    h1{font:400 clamp(34px,5.2vw,76px)/1.05 'Monument Extended',Arial,sans-serif;letter-spacing:-.012em;margin:18px 0 0;text-wrap:balance}
    p{margin:18px 0 0;color:#dfe6e7;max-width:420px;text-wrap:pretty}
    .home{display:inline-flex;align-items:center;gap:10px;height:50px;margin-top:34px;padding:0 26px 0 22px;border:1px solid #ffffff9c;border-radius:999px;font-size:15px;font-weight:500;transition:background .2s,border-color .2s,color .2s}
    .home:hover,.home:focus-visible{background:var(--acid);border-color:var(--acid);color:var(--ink)}
    .home:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
    @media(max-width:600px){header{height:70px}.monogram{font-size:20px}main{height:calc(100% - 70px);padding-bottom:70px}}
  </style>
</head>
<body>
  <div class="art" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
  <header><a class="monogram" href="./" aria-label="Berkay Alioglu, home">BA<span>.</span></a><span class="role">AI Artist</span></header>
  <main>
    <span class="code">404 / Page not found</span>
    <h1>Out of frame.</h1>
    <p>This page doesn’t exist, or it has moved. The work is still one click away.</p>
    <a class="home" href="./"><span aria-hidden="true">←</span> Back to the work</a>
  </main>
</body>
</html>
